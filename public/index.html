<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Quiz Arena</title>
    <script>
      // Light (paper) or dark (cluster): saved choice, otherwise the device setting. Runs before paint.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('qa-mode'); } catch (e) {}
        var mode = saved === 'light' || saved === 'dark' ? saved
          : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = mode === 'light' ? 'paper' : 'cluster';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2'%3E%3Cpath d='M9 22L16 10L23 19'/%3E%3C/g%3E%3Cg fill='%23fff'%3E%3Ccircle cx='9' cy='22' r='3'/%3E%3Ccircle cx='16' cy='10' r='3'/%3E%3Ccircle cx='23' cy='19' r='3'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main id="app" class="wrap"><p class="loading">Loading…</p></main>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
